  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sasa's 30th</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Italiana&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Libre+Baskerville:ital,wght@0,400;1,400&family=Caveat:wght@500;600;700&family=Allura&family=Dancing+Script:wght@500;600"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f5f0e8;
      --ink: #2a1f0e;
      --gold: #a08040;
      --sub: #7a6535;
      --form-bg: #e8dfc8;
      --footer-bg: #d8cdb0;
      --div: rgba(160, 128, 64, .18);
      --body-text: #5a4a2e;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Avenir Next', 'Avenir', 'Helvetica Neue', sans-serif;
      font-weight: 300;
      line-height: 1.6;
    }

    .draft-banner {
      background: var(--ink);
      color: rgba(242, 234, 214, .7);
      text-align: center;
      font-size: 8.5px;
      letter-spacing: .45em;
      text-transform: uppercase;
      padding: 9px 0;
    }

    .hero {
      padding: 48px 48px 28px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero-eyebrow {
      font-size: 9px;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .hero-title {
      font-family: 'Italiana', 'Didot', 'Bodoni 72', 'Hoefler Text', Georgia, serif;
      font-size: clamp(72px, 12vw, 112px);
      line-height: 1.0;
      letter-spacing: .02em;
      margin-bottom: 18px;
    }

    .hero-tagline {
      font-family: 'Cormorant Garamond', 'Hoefler Text', 'Iowan Old Style', 'Cormorant', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      font-weight: 300;
      color: var(--sub);
      line-height: 1.7;
      max-width: 480px;
      margin-bottom: 8px;
    }

    .hero-dates {
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--gold);
      line-height: 2;
    }

    .hero-dates strong {
      font-weight: 700;
      letter-spacing: .22em;
      color: var(--gold);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .photo-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    .form-spacer {
      height: 44px;
      background: var(--bg);
    }

    .form-wrap {
      background: var(--form-bg);
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 48px 40px;
    }

    .form-head {
      font-family: 'Italiana', 'Didot', 'Bodoni 72', 'Hoefler Text', Georgia, serif;
      font-size: 32px;
      color: var(--ink);
      margin-bottom: 10px;
      letter-spacing: .02em;
    }

    .form-intro-top {
      font-family: 'Cormorant Garamond', 'Hoefler Text', 'Iowan Old Style', 'Cormorant', Georgia, serif;
      font-style: italic;
      font-size: 13px;
      color: var(--sub);
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 8px;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
      margin-top: 18px;
    }

    .form-input {
      width: 100%;
      border: 1px solid var(--div);
      border-radius: 0;
      background: rgba(242, 234, 214, .4);
      padding: 10px 12px;
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Avenir Next', 'Avenir', 'Helvetica Neue', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: var(--ink);
      outline: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px 40px;
      margin-top: 18px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
    }

    @media(max-width:720px) {
      .form-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
    }

    .form-input:focus {
      border-bottom-color: var(--gold);
    }

    .days-select-wrap select {
      width: 100%;
      border: 1px solid var(--div);
      background: rgba(242, 234, 214, .4);
      padding: 10px 12px;
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Avenir Next', 'Avenir', 'Helvetica Neue', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: var(--ink);
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      border-radius: 0;
    }

    .form-scroll-hint {
      font-family: 'Cormorant Garamond', 'Hoefler Text', 'Iowan Old Style', 'Cormorant', Georgia, serif;
      font-style: italic;
      font-size: 12px;
      color: rgba(122, 101, 53, .7);
      line-height: 1.6;
      margin: 5px 0 9px;
    }

    .days-toggle-btn {
      padding: 10px 14px;
      background: rgba(242, 234, 214, .4);
      border: 1px solid var(--div);
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Avenir Next', 'Avenir', 'Helvetica Neue', sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: var(--ink);
      cursor: pointer;
      display: block;
      width: 100%;
      text-align: left;
    }

    .days-toggle-btn:hover {
      background: rgba(215, 200, 165, .4);
    }

    .check-group {
      flex-direction: column;
      gap: 0;
    }

    .check-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(242, 234, 214, .4);
      border: 1px solid var(--div);
      border-bottom: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 300;
      color: var(--ink);
    }

    .check-opt:last-child {
      border-bottom: 1px solid var(--div);
    }

    .check-opt:hover,
    .check-opt.selected {
      background: rgba(200, 185, 138, .3);
    }

    .check-box {
      width: 16px;
      height: 16px;
      border: 1.5px solid rgba(160, 128, 64, .4);
      border-radius: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check-opt.selected .check-box {
      background: var(--gold);
      border-color: var(--gold);
    }

    .check-inner {
      font-size: 10px;
      color: #fff;
      display: none;
      line-height: 1;
    }

    .check-opt.selected .check-inner {
      display: block;
    }

    .form-helper {
      font-family: 'Cormorant Garamond', 'Hoefler Text', 'Iowan Old Style', 'Cormorant', Georgia, serif;
      font-style: italic;
      font-size: 12px;
      color: rgba(122, 101, 53, .7);
      line-height: 1.6;
      margin: 5px 0 9px;
    }

    .form-btn {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      background: var(--ink);
      color: rgba(242, 234, 214, .9);
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Avenir Next', 'Avenir', 'Helvetica Neue', sans-serif;
      font-size: 9.5px;
      font-weight: 400;
      letter-spacing: .38em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
    }

    .form-btn:hover {
      background: #3d2e15;
    }

    .form-note {
      font-family: 'Cormorant Garamond', 'Hoefler Text', 'Iowan Old Style', 'Cormorant', Georgia, serif;
      font-style: italic;
      font-size: 12.5px;
      font-weight: 400;
      color: rgba(80, 60, 20, .6);
      text-align: center;
      margin-top: 10px;
      line-height: 1.7;
      display: block;
    }

    .form-note-sub {
      font-size: 11px;
      color: rgba(80, 60, 20, .45);
      margin-top: 3px;
    }

    #itinerary {
      background: var(--bg);
      max-width: 1200px;
      margin: 0 auto;
    }

    .day {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 0 20px;
      padding: 40px 48px;
      border-top: 1px solid var(--div);
    }

    .day-num {
      font-family: 'Italiana', 'Didot', 'Bodoni 72', 'Hoefler Text', Georgia, serif;
      font-size: 88px;
      line-height: .92;
      color: rgba(160, 128, 64, .17);
      letter-spacing: -.02em;
      padding-top: 4px;
      align-self: start;
    }

    .day-content {
      min-width: 0;
    }

    .day-dow {
      font-family: 'Italiana', 'Didot', 'Bodoni 72', 'Hoefler Text', Georgia, serif;
      font-size: 46px;
      font-weight: 400;
      letter-spacing: .01em;
      line-height: 1.0;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .day-date {
      font-size: 9px;
      letter-spacing: .38em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 3px;
    }

    .day-opt {
      font-size: 9px;
      letter-spacing: .38em;
      text-transform: uppercase;
      color: var(--gold);
      font-style: italic;
      margin-bottom: 3px;
    }

    .day-tag {
      font-family: 'Cormorant Garamond', 'Hoefler Text', 'Iowan Old Style', 'Cormorant', Georgia, serif;
      font-style: italic;
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 26px;
      line-height: 1.5;
      margin-top: 2px;
    }

    .ev-time {
      font-family: 'Cormorant Garamond', 'Hoefler Text', 'Iowan Old Style', 'Cormorant', Georgia, serif;
      font-style: italic;
      font-size: 11px;
      color: rgba(122, 101, 53, .55);
      letter-spacing: .06em;
      margin-bottom: 6px;
      text-transform: lowercase;
    }

    .moodboard-section {
      padding: 60px 48px 50px;
      border-top: 1px solid var(--div);
      max-width: 1200px;
      margin: 0 auto;
    }

    .moodboard-section h2 {
      font-family: 'Cormorant Garamond', 'Hoefler Text', 'Iowan Old Style', 'Cormorant', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 32px;
      letter-spacing: .02em;
      color: var(--ink);
      margin: 0 0 24px;
      text-align: center;
    }

    .moodboard-section .moodboard-sub {
      font-family: 'Cormorant Garamond', 'Hoefler Text', 'Iowan Old Style', 'Cormorant', Georgia, serif;
      font-style: italic;
      font-size: 13px;
      color: var(--sub);
      text-align: center;
      margin-bottom: 36px;
    }

    .moodboard-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .moodboard-grid img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
    }

    .footer-signoff {
      font-family: 'Fraunces', 'Iowan Old Style', 'Charter', Georgia, serif;
